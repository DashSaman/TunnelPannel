server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # صفحه اصلی
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    # پنل مدیریت
    location = /admin {
        try_files /admin.html =404;
    }

    location = /admin/ {
        return 301 /admin;
    }

    # سازنده تونل
    location = /composer {
        try_files /composer.html =404;
    }

    location = /composer/ {
        return 301 /composer;
    }

    # پنل کاربر
    location = /app {
        try_files /app.html =404;
    }

    location = /app/ {
        return 301 /app;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # API
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # مستندات API
    location = /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # جلوگیری از مشاهده فایل‌های مخفی
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # جلوگیری از درخواست فایل‌های حساس و Backup
    location ~* \.(env|ini|log|sql|bak|backup|old|key|pem|yml|yaml|toml|conf|zip|tar|gz)$ {
        return 404;
    }

    # هر مسیر ناشناخته 404 شود
    location / {
        try_files $uri =404;
    }
}
