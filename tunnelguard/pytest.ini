[pytest]
testpaths = tests
markers =
    unit_portable: runs on any OS (Windows/Linux) — pure logic, no OS-specific networking APIs
    linux_integration: requires a Linux userspace (POSIX os APIs etc.) — skip elsewhere, run in Linux CI
    linux_privileged: requires Linux + CAP_NET_ADMIN / root (netns, interfaces, nftables)
    real_node_e2e: requires real remote nodes with valid credentials — never in ordinary CI
