services:
  controller:
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile
    image: tehnet-tunnel-controller:${TP_RELEASE:?an immutable release is required}
    container_name: tunnelpannel-tehnet-controller
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    init: true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.50
    ports: ["127.0.0.1:${TP_CONTROLLER_PORT:-21001}:8080"]
    env_file: ["${TP_CONTROLLER_ENV:?a private environment file is required}"]
    environment:
      DATABASE_URL: sqlite:////data/tunnelpannel.db
      TP_WORKSPACES_DIR: /data/workspaces
      TP_CONTROL_PLANE_ONLY: "1"
    volumes: ["${TP_CONTROLLER_DATA:?a durable data path is required}:/data"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=700"]
    logging:
      driver: local
      options: {max-size: "2m", max-file: "2"}
    labels:
      io.tunnelpannel.component: management-control-plane
    networks: [controlplane]
networks:
  controlplane:
    external: true
    name: tunnelpannel-controlplane
