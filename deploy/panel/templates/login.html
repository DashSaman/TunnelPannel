<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTF · Login</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body{display:grid;place-items:center;min-height:100vh}
  .login{width:min(400px,92vw);padding:34px 30px;text-align:center}
  .login .logo{width:56px;height:56px;margin-bottom:10px}
  .login h1{font-size:22px;letter-spacing:.04em}
  .login .sub{margin-bottom:24px}
  .field{margin-bottom:14px;text-align:start}
  .field label{display:block;font-size:12px;color:var(--text-low);margin-bottom:6px}
  .field input{width:100%}
  .btn{width:100%;margin-top:8px}
  .err{color:var(--bad);font-size:12.5px;margin-bottom:12px}
  .meta{margin-top:18px;font-size:11.5px}
</style>
</head>
<body>
  <form class="card login glass" method="post" action="/login">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="var(--surface-2)"/>
      <path d="M8 22V10m8 12V14m8 8V6" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h1>MTF PANEL</h1>
    <p class="sub muted">{{count}} tunnel methods · failover engine</p>
    {% if err %}<div class="err">{{err}}</div>{% endif %}
    <div class="field">
      <label>username / نام کاربری</label>
      <input class="input" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label>password / رمز عبور</label>
      <input class="input" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" type="submit">ورود / Sign in</button>
    <p class="meta muted">Multi-Tunnel Failover · 82 methods · IPv4 + IPv6</p>
  </form>
</body>
</html>
