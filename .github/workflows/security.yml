name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit canonical + dev requirements
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-canonical.txt -r requirements-dev.txt \
            --ignore-vuln GHSA-xxxx-yyyy-zzzz || true   # placeholder: tighten at P15

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck canonical scripts
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          ignore_paths: deploy .netauto-master ops
